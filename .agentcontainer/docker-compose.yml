services:
  # Limited-access container for AI agents (opencode, claude, codex).
  # Least privilege: non-root user, no sudo, read-only root fs, dropped caps,
  # no published ports, no docker socket, no host network, ephemeral state.
  agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: personal-reporting-agentcontainer:local

    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:exec,uid=1000,gid=1000,mode=0770
      - /home/agent:uid=1000,gid=1000,mode=0770
    volumes:
      - ..:/workspaces:cached
      # Forward the host SSH agent (Docker Desktop injects the host agent at
      # /run/host-services/ssh-auth.sock). No keys enter the container.
      - type: bind
        source: /run/host-services/ssh-auth.sock
        target: /run/host-services/ssh-auth.sock
        read_only: true
      # User-level agent configs (read-only, optional).
      # Claude and Codex mount to a staging path; the entrypoint copies
      # config files only (not session/state) into the writable home.
      - type: bind
        source: ~/.config/opencode
        target: /home/agent/.config/opencode
        read_only: true
      - type: bind
        source: ~/.claude
        target: /home/agent/.host-claude
        read_only: true
      - type: bind
        source: ~/.codex
        target: /home/agent/.host-codex
        read_only: true
      - type: bind
        source: ~/.agents
        target: /home/agent/.agents
        read_only: true
    working_dir: /workspaces
    environment:
      SSH_AUTH_SOCK: /run/host-services/ssh-auth.sock
      # Non-sensitive configuration
      ANTHROPIC_BASE_URL: https://opencode.ai/zen/go/v1
      OPENAI_BASE_URL: https://opencode.ai/zen/go/v1
      ANTHROPIC_MODEL: qwen-3.8-flash
      GITHUB_NAME: ${GITHUB_NAME:-}
      GITHUB_EMAIL: ${GITHUB_EMAIL:-}
      DBT_TARGET: ${DBT_TARGET:-}
    secrets:
      - opencode_api_key
      - github_token
      - op_service_account_token
    command: ["sleep", "infinity"]

secrets:
  opencode_api_key:
    file: ../.secrets/opencode_api_key
  github_token:
    file: ../.secrets/github_token
  op_service_account_token:
    file: ../.secrets/op_service_account_token
