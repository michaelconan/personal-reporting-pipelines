services:
  # Limited-access container for AI agents (opencode, claude, codex).
  # Least privilege: non-root user, no sudo, read-only root fs, dropped caps,
  # no published ports, no docker socket, no host network, ephemeral state.
  agent:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Injected at build time from the local 1Password CLI, e.g.:
        #   OP_SERVICE_ACCOUNT_TOKEN="$(op read 'op://Vault/Service Account/credential')" \
        #     docker compose -f .agentcontainer/docker-compose.yml build
        OP_SERVICE_ACCOUNT_TOKEN: ${OP_SERVICE_ACCOUNT_TOKEN:-}
    image: personal-reporting-agentcontainer:local

    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:exec,uid=1000,gid=1000,mode=0770
      - /home/agent:uid=1000,gid=1000,mode=0770
    volumes:
      - ..:/workspaces:cached
      # Forward the host SSH agent (Docker Desktop injects the host agent at
      # /run/host-services/ssh-auth.sock). No keys enter the container.
      - type: bind
        source: /run/host-services/ssh-auth.sock
        target: /run/host-services/ssh-auth.sock
        read_only: true
    working_dir: /workspaces
    environment:
      SSH_AUTH_SOCK: /run/host-services/ssh-auth.sock
      # Model access for opencode, claude and codex (OpenCode Zen/Go catalog).
      # claude and codex are routed through the Zen gateway using the same key.
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:-}
      ANTHROPIC_API_KEY: ${OPENCODE_API_KEY:-}
      ANTHROPIC_BASE_URL: https://opencode.ai/zen
      OPENAI_API_KEY: ${OPENCODE_API_KEY:-}
      OPENAI_BASE_URL: https://opencode.ai/zen/v1
      # Convenience for git/GitHub operations by the agents
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_NAME: ${GITHUB_NAME:-}
      GITHUB_EMAIL: ${GITHUB_EMAIL:-}
      DBT_TARGET: ${DBT_TARGET:-}
    command: ["sleep", "infinity"]