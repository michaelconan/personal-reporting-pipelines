---
name: personal
version: 1.0.0
profile: personal
model-paths: [models]
analysis-paths: [analyses]
test-paths: [tests]
macro-paths: [macros]
snapshot-paths: [snapshots]
# directories to be removed by `dbt clean`
clean-targets: [target, dbt_packages]

flags:
  indirect_selection: cautious
# Override configuration for dbt_utils macros to add duckdb support
dispatch:
  - macro_namespace: dbt_utils
    search_order:
      - personal
      - dbt_utils
# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models
models:
  personal:
    +persist_docs:
      relation: true
      columns: true
    staging:
      +materialized: view
    core:
      +materialized: view
    intermediate:
      +materialized: table
      +contract:
        enforced: true
    marts:
      +materialized: table
      +contract:
        enforced: true
# Sources are enabled for all targets: on DuckDB (mock) each source table is
# read from its test fixture via the `external_location` meta on the source;
# on Databricks targets sources resolve to the raw schema in Unity Catalog.
vars:
  dbt_date:time_zone: UTC
  # Upper sanity cap for a single sleep session; sessions beyond this are
  # treated as recording artifacts and dropped at staging.
  max_sleep_hours: 15

# Databricks-specific configurations
# These configs apply when targeting Databricks (dev/test/prod targets)
# BigQuery targets (dev-bigquery/test-bigquery/prod-bigquery) are retained
# for easy rollback path