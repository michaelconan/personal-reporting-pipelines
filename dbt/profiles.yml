---
anchors:
  # Databricks Unity Catalog configuration for test/prod - OAuth with service principal
  - &databricks_config
    type: databricks
    host:
      "{{ env_var('DESTINATION__DATABRICKS__CREDENTIALS__SERVER_HOSTNAME') }}"
    http_path:
      "{{ env_var('DESTINATION__DATABRICKS__CREDENTIALS__HTTP_PATH') }}"
    catalog:
      "{{ env_var('DESTINATION__DATABRICKS__CREDENTIALS__CATALOG', 'workspace')
      }}"
    schema: "{{ env_var('DBT_SCHEMA', 'reporting') }}"
    threads: 4
  # BigQuery configuration retained for rollback path
  - &bigquery_config
    type: bigquery
    method: service-account
    project: "{{ env_var('GCP_PROJECT_ID') }}"
    keyfile: "{{ env_var('GOOGLE_APPLICATION_CREDENTIALS') }}"
personal:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
  outputs:
    mock:
      type: duckdb
      path: dbt.duckdb
      schema: "{{ env_var('DBT_SCHEMA', 'reporting_dev') }}"
      # Pin the session timezone so timestamp→date casts match Databricks (UTC)
      settings:
        TimeZone: UTC
    # Primary targets - Databricks Unity Catalog
    dev:
      # Use the same token-based connection settings as the dlt destination.
      <<: *databricks_config
      token:
        "{{ env_var('DESTINATION__DATABRICKS__CREDENTIALS__ACCESS_TOKEN') }}"
      schema: "{{ env_var('DBT_SCHEMA', 'reporting_dev') }}"
    test:
      <<: *databricks_config
      client_id:
        "{{ env_var('DESTINATION__DATABRICKS__CREDENTIALS__CLIENT_ID') }}"
      client_secret:
        "{{ env_var('DESTINATION__DATABRICKS__CREDENTIALS__CLIENT_SECRET') }}"
      auth_type: oauth
      schema: "{{ env_var('DBT_SCHEMA', 'reporting_test') }}"
    prod:
      <<: *databricks_config
      client_id:
        "{{ env_var('DESTINATION__DATABRICKS__CREDENTIALS__CLIENT_ID') }}"
      client_secret:
        "{{ env_var('DESTINATION__DATABRICKS__CREDENTIALS__CLIENT_SECRET') }}"
      auth_type: oauth
      schema: "{{ env_var('DBT_SCHEMA', 'reporting') }}"
    # Rollback targets - BigQuery (retained for easy rollback path)
    dev-bq:
      <<: *bigquery_config
      dataset: "{{ env_var('DBT_SCHEMA', 'reporting_dev') }}"
      threads: 4
    test-bq:
      <<: *bigquery_config
      dataset: "{{ env_var('DBT_SCHEMA', 'reporting_test') }}"
      threads: 4
    prod-bq:
      <<: *bigquery_config
      dataset: "{{ env_var('DBT_SCHEMA', 'reporting') }}"
      threads: 4
