version: 2
models:
- name: int_habits
  description: 'Unified habit occurrences across sources: Notion tickbox/number habits,
    sleep minutes, daily steps, and community engagement habits.'
  columns:
  - name: habit_key
    description: Surrogate key uniquely identifying each habit occurrence.
    data_type: string
    data_tests:
    - unique
    constraints:
    - type: not_null
  - name: source_id
    description: The source identifier (page id, sleep session id, activity date,
      or engagement id).
    data_type: string
    constraints:
    - type: not_null
  - name: habit_date
    description: The date for the habit tracking period.
    data_type: date
    constraints:
    - type: not_null
  - name: habit_period
    description: The period for which the habit is tracked (day, week, or month).
    data_type: string
    constraints:
    - type: not_null
  - name: habit
    description: The key of the habit being tracked.
    data_type: string
    constraints:
    - type: not_null
  - name: habit_value
    description: The value of the habit tracked (1.0/0.0 for tickbox habits, metric
      values for number habits).
    data_type: numeric
    constraints:
    - type: not_null
  constraints:
  - type: primary_key
    columns:
    - habit_key
