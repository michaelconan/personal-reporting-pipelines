version: 2
models:
- name: habits
  description: 'Mart table combining habit events, health habits (sleep), and community
    engagement habits. Grain: one row per habit occurrence.'
  versions:
  - v: 1
    defined_in: habits_v1
    description: 'Mart table combining habit events, health habits (sleep), and community
      engagement habits. Grain: one row per habit occurrence.'
  columns:
  - name: habit_key
    description: Surrogate key uniquely identifying each habit record
    data_type: string
    data_tests:
    - unique
    constraints:
    - type: not_null
  - name: source_id
    description: The source identifier (page_id for habit events, session date for
      health habits, activity date for step habits, engagement_id for community habits)
    data_type: string
    constraints:
    - type: not_null
  - name: habit_date
    description: The date for the habit tracking period
    data_type: date
    constraints:
    - type: not_null
  - name: habit_period
    description: The period for which the habit is tracked (day, week, or month)
    data_type: string
    constraints:
    - type: not_null
  - name: habit
    description: The name of the habit being tracked (e.g., met_1to1, met_group, sleep_minutes,
      did_devotional, etc.)
    data_type: string
    constraints:
    - type: not_null
  - name: habit_value
    description: The value of the habit tracked (e.g., 1.0/0.0 for tickbox, minutes
      for sleep, steps count for activity)
    data_type: numeric
    constraints:
    - type: not_null
  constraints:
  - type: primary_key
    columns:
    - habit_key
- name: habits_metrics_v1
  description: 'Completion rates for every habit per tracked period against the Notion
    habit reference targets and thresholds. Grain: one row per habit per tracked period.'
  constraints:
  - type: primary_key
    columns:
    - metric_key
  columns:
  - name: metric_key
    description: The primary key for this table (surrogate key from the habit and
      tracked period).
    data_type: string
    data_tests:
    - not_null
    - unique
  - name: habit
    description: The key of the habit being tracked.
    data_type: string
    constraints:
    - type: not_null
  - name: habit_name
    description: The display name of the habit from the Notion habit reference.
    data_type: string
  - name: category
    description: The habit category (faith, life, health, community, work).
    data_type: string
  - name: frequency
    description: The tracking frequency of the habit (day, week, month).
    data_type: string
  - name: source
    description: The source system that tracks the habit.
    data_type: string
  - name: habit_type
    description: How completion is derived (tickbox, number, or count).
    data_type: string
  - name: period_start_date
    description: The start of the aggregation period.
    data_type: date
    constraints:
    - type: not_null
  - name: report_period
    description: The aggregation period type (week or month).
    data_type: string
    constraints:
    - type: not_null
  - name: total_periods
    description: The number of tracked periods within the aggregation period.
    data_type: bigint
  - name: completed_periods
    description: The number of periods where the habit was completed.
    data_type: bigint
  - name: target_pct
    description: The completion target percentage from the habit reference.
    data_type: numeric
  - name: threshold
    description: The numeric threshold for number habits from the habit reference.
    data_type: numeric
  - name: is_below_threshold
    description: Whether the threshold comparison is inverted.
    data_type: boolean
  - name: is_active
    description: Whether the habit is currently active.
    data_type: boolean
  - name: completion_rate
    description: The share of completed periods, rounded to 4 decimals.
    data_type: numeric
  - name: target_met
    description: Whether the completion rate meets the reference target percentage.
    data_type: boolean
