---
version: 2
models:
  - name: stg_notion__daily_habits
    description: Unique daily habits from the Notion habit tracker.
    columns:
      - name: page_id
        description: The primary key for this table
        data_type: varchar
        data_tests:
          - not_null
          - unique
      - name: database_id
        description: The ID of the parent database.
        data_type: varchar
        data_tests:
          - not_null
      - name: page_date
        description: The date of the habit entry.
        data_type: date
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: date '2020-01-01'
                max_value: date '2030-12-31'
      - name: page_name
        description: The name of the habit entry.
        data_type: varchar
        data_tests:
          - not_null
      - name: did_devotional
        description: Whether the devotional habit was completed.
        data_type: boolean
        data_tests:
          - not_null
      - name: did_journal
        description: Whether the journal habit was completed.
        data_type: boolean
        data_tests:
          - not_null
      - name: did_prayer
        description: Whether the prayer habit was completed.
        data_type: boolean
        data_tests:
          - not_null
      - name: did_read_bible
        description: Whether the read bible habit was completed.
        data_type: boolean
        data_tests:
          - not_null
      - name: did_workout
        description: Whether the workout habit was completed.
        data_type: boolean
        data_tests:
          - not_null
      - name: did_language
        description: Whether the language habit was completed.
        data_type: boolean
        data_tests:
          - not_null
      - name: created_at
        description: The date the page was created.
        data_type: timestamp
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: timestamp '2020-01-01'
                max_value: timestamp '2030-12-31'
      - name: updated_at
        description: The date the page was last edited.
        data_type: timestamp
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: timestamp '2020-01-01'
                max_value: timestamp '2030-12-31'
  - name: stg_notion__weekly_habits
    description: Unique weekly habits from the Notion habit tracker.
    columns:
      - name: page_id
        description: The primary key for this table
        data_type: varchar
        data_tests:
          - not_null
          - unique
      - name: database_id
        description: The ID of the parent database.
        data_type: varchar
        data_tests:
          - not_null
      - name: page_date
        description: The date of the habit entry.
        data_type: date
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: date '2020-01-01'
                max_value: date '2030-12-31'
      - name: page_name
        description: The name of the habit entry.
        data_type: varchar
        data_tests:
          - not_null
      - name: did_fast
        description: Whether the fast habit was completed.
        data_type: boolean
        data_tests:
          - not_null
      - name: prayer_minutes
        description: The number of minutes spent in prayer.
        data_type: varchar
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 30
                row_condition: prayer_minutes is not null
      - name: screen_minutes
        description: The number of minutes spent on screen.
        data_type: integer
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 250
                max_value: 2000
                row_condition: screen_minutes is not null
      - name: did_church
        description: Whether the church habit was completed.
        data_type: boolean
        data_tests:
          - not_null
      - name: did_community
        description: Whether the community habit was completed.
        data_type: boolean
        data_tests:
          - not_null
      - name: did_cook
        description: Whether the cook habit was completed.
        data_type: boolean
        data_tests:
          - not_null
      - name: did_cardio
        description: Whether the cardio habit was completed.
        data_type: boolean
        data_tests:
          - not_null
      - name: did_sabbath
        description: Whether the sabbath habit was completed.
        data_type: boolean
        data_tests:
          - not_null
      - name: did_date_night
        description: Whether the date night habit was completed.
        data_type: boolean
        data_tests:
          - not_null
      - name: created_at
        description: The date the page was created.
        data_type: timestamp
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: timestamp '2020-01-01'
                max_value: timestamp '2030-12-31'
      - name: updated_at
        description: The date the page was last edited.
        data_type: timestamp
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: timestamp '2020-01-01'
                max_value: timestamp '2030-12-31'
  - name: stg_notion__habit_reference
    description: Cleaned Notion habit reference with canonical habit keys, targets,
      and thresholds for all tracked disciplines.
    columns:
      - name: page_id
        description: The primary key for this table (Notion page id).
        data_type: string
        data_tests:
          - not_null
          - unique
      - name: habit_key
        description: The canonical habit key used to join with the habits mart.
        data_type: string
      - name: habit_name
        description: The display name of the habit.
        data_type: string
        data_tests:
          - not_null
      - name: category
        description: The habit category (e.g. Faith, Life, Health).
        data_type: string
      - name: frequency
        description: The tracking frequency of the habit (day, week, month).
        data_type: string
      - name: habit_type
        description: How completion is derived (tickbox, number, count).
        data_type: string
      - name: source
        description: The source system that tracks the habit.
        data_type: string
      - name: target_pct
        description: Completion target as a percentage integer (e.g. 80 = 80%).
        data_type: numeric
      - name: threshold
        description: Numeric threshold for number habits.
        data_type: numeric
      - name: is_below_threshold
        description: Whether the threshold comparison is inverted.
        data_type: boolean
      - name: is_active
        description: Whether the habit is currently active.
        data_type: boolean
        data_tests:
          - not_null
      - name: start_date
        description: The date the habit tracking started.
        data_type: date
      - name: created_at
        description: When the reference page was created.
        data_type: timestamp
        data_tests:
          - not_null
      - name: updated_at
        description: When the reference page was last edited.
        data_type: timestamp
        data_tests:
          - not_null
