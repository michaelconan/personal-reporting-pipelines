---
version: 2
sources:
  - name: notion
    description: Source data from the Notion habit tracker.
    loader: dlt
    schema: "{{ env_var('RAW_SCHEMA', 'raw') }}"
    config:
      # Freshness is measured from the dlt load timestamp: join each row's
      # _dlt_load_id to dlt's _dlt_loads metadata table and take the latest
      # completed load. See https://github.com/michaelconan/personal-reporting-pipelines/issues/141
      freshness:
        warn_after: {count: 336, period: hour}  # 14 days (weekly schedule)
        error_after: {count: 384, period: hour}  # 16 days
      loaded_at_query: |
        select max(loads.inserted_at)
        from {{ this }} as rows
        join `{{ this.database }}.{{ this.schema }}._dlt_loads` as loads
          on rows._dlt_load_id = loads.load_id
        where loads.status = 0
      # On DuckDB (mock) targets each table is read directly from its test
      # fixture CSV as an external location; on BigQuery targets the key is
      # inert and {identifier} is ignored.
      external_location: dbt/test_fixtures/notion/{identifier}.csv
    tables:
      - name: data_source_daily_habits
        identifier: notion__data_source_daily_habits
        description: Raw habit entries from the daily habits data source.
        columns:
          - name: parent__data_source_id
            data_type: varchar
            data_tests:
              - not_null
          - name: id
            data_type: varchar
            data_tests:
              - not_null
          - name: properties__date__date
            data_type: json
            data_tests:
              - not_null
          - name: properties__name__title
            data_type: varchar
            data_tests:
              - not_null
          - name: properties__devotional__checkbox
            data_type: boolean
            data_tests:
              - not_null
          - name: properties__journal__checkbox
            data_type: boolean
            data_tests:
              - not_null
          - name: properties__prayer__checkbox
            data_type: boolean
            data_tests:
              - not_null
          - name: properties__read_bible__checkbox
            data_type: boolean
            data_tests:
              - not_null
          - name: properties__workout__checkbox
            data_type: boolean
            data_tests:
              - not_null
          - name: properties__language__checkbox
            data_type: boolean
            data_tests:
              - not_null
          - name: created_time
            data_type: timestamp
            data_tests:
              - not_null
          - name: last_edited_time
            data_type: timestamp
            data_tests:
              - not_null
