version: 2

models:
  - name: stg_fitbit__activities
    description: "Staging model for fitbit activity log data."
    columns:
      - name: date_of_activity
        description: "The date of activity"
        data_type: date
        data_tests:
          - not_null
          - unique
      - name: steps
        description: "Total steps recorded on date_of_activity"
        data_type: integer
        data_tests:
          - not_null
      - name: steps_goal_met
        description: "Boolean indicating if step goal was met"
        data_type: boolean
        data_tests:
          - not_null

  - name: stg_fitbit__sleep
    description: "Staging model for fitbit sleep data."
    columns:
      - name: log_id
        description: "The primary key for this table"
        data_type: integer
        data_tests:
          - not_null
          - unique
      - name: date_of_sleep
        description: "The date of the sleep log."
        data_type: date
        data_tests:
          - not_null
      - name: duration_ms
        description: "The duration of the sleep in milliseconds."
        data_type: integer
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 7200000    # 2 hours
                max_value: 43200000   # 12 hours
      - name: duration_hr
        description: "The duration of the sleep in hours."
        data_type: float
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 2    # 2 hours
                max_value: 12   # 12 hours
      - name: started_at
        description: "The start time of the sleep."
        data_type: timestamp
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: "timestamp '2019-01-01'"
                max_value: "timestamp '2030-12-31'"
      - name: ended_at
        description: "The end time of the sleep."
        data_type: timestamp
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: "timestamp '2020-01-01'"
                max_value: "timestamp '2030-12-31'"
      - name: sleep_type
        description: "The type of the sleep log."
        data_type: varchar
        data_tests:
          - not_null
      - name: log_type
        description: "The type of the log."
        data_type: varchar
        data_tests:
          - not_null
      - name: sleep_goal_met
        description: "Whether the sleep goal was met."
        data_type: boolean
        data_tests:
          - not_null