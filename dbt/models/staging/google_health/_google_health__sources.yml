---
version: 2
sources:
  - name: google_health
    description: Source data from the Google Health / Health Connect APIs.
    loader: dlt
    schema: "{{ env_var('RAW_SCHEMA', 'raw') }}"
    config:
      # Freshness is measured from the dlt load timestamp: join each row's
      # _dlt_load_id to dlt's _dlt_loads metadata table and take the latest
      # completed load. See https://github.com/michaelconan/personal-reporting-pipelines/issues/141
      freshness:
        warn_after: {count: 336, period: hour}  # 14 days (weekly schedule)
        error_after: {count: 384, period: hour}  # 16 days
      loaded_at_query: |
        select max(loads.inserted_at)
        from {{ this }} as rows
        join `{{ this.database }}.{{ this.schema }}._dlt_loads` as loads
          on rows._dlt_load_id = loads.load_id
        where loads.status = 0
      # On DuckDB (mock) targets each table is read directly from its test
      # fixture CSV as an external location; on BigQuery targets the key is
      # inert and {identifier} is ignored.
      external_location: test_fixtures/google_health/{identifier}.csv
    tables:
      - name: sleep
        identifier: google_health__sleep
        description: Sleep session data imported from Google Health (e.g. from Fitbit
          / Google Fit).
        columns:
          - name: name
            description: Fully qualified resource name of the sleep data point.
            data_type: varchar
            data_tests:
              - not_null
          - name: sleep__interval__start_time
            description: Start time of the sleep interval.
            data_type: timestamp
            data_tests:
              - not_null
          - name: sleep__interval__end_time
            description: End time of the sleep interval.
            data_type: timestamp
            data_tests:
              - not_null
          - name: sleep__interval__start_utc_offset
            description: UTC offset of the sleep interval start (e.g. 3600s).
            data_type: varchar
          - name: sleep__type
            description: Sleep recording format (STAGES, CLASSIC, ...).
            data_type: varchar
          - name: sleep__summary__minutes_asleep
            description: Minutes recorded as asleep in the sleep summary.
            data_type: varchar
          - name: sleep__metadata__main_sleep
            description: Whether the session is the main sleep of the day.
            data_type: boolean
          - name: sleep__metadata__nap
            description: Whether the session is a nap.
            data_type: boolean
          - name: _dlt_id
            description: dlt-generated row hash (row key for the raw table).
            data_type: varchar
            data_tests:
              - not_null
      - name: steps
        identifier: google_health__steps
        description: Step count interval data imported from the Google Health / Healthy
          DataSource API.
        columns:
          - name: steps__count
            description: Number of steps recorded within the step interval.
            data_type: varchar
            data_tests:
              - not_null
          - name: steps__interval__start_time
            description: Start time of the step interval.
            data_type: timestamp
            data_tests:
              - not_null
          - name: steps__interval__end_time
            description: End time of the step interval.
            data_type: timestamp
            data_tests:
              - not_null
          - name: steps__interval__civil_start_time__date__year
            description: Local (civil) year of the step interval start.
            data_type: integer
            data_tests:
              - not_null
          - name: steps__interval__civil_start_time__date__month
            description: Local (civil) month of the step interval start.
            data_type: integer
            data_tests:
              - not_null
          - name: steps__interval__civil_start_time__date__day
            description: Local (civil) day of the step interval start.
            data_type: integer
            data_tests:
              - not_null
          - name: _dlt_id
            description: dlt-generated row hash for the raw table.
            data_type: varchar
            data_tests:
              - not_null
      - name: exercise
        identifier: google_health__exercise
        description: Exercise session data imported from the Google Health / Healthy
          DataSource API.
        columns:
          - name: name
            description: Fully qualified name of the exercise data point.
            data_type: varchar
            data_tests:
              - not_null
          - name: exercise__exercise_type
            description: Exercise type (e.g. WALKING, RUNNING, WORKOUT).
            data_type: varchar
          - name: exercise__display_name
            description: Human readable exercise name.
            data_type: varchar
          - name: exercise__active_duration
            description: Active duration string (e.g. 400.500s).
            data_type: varchar
          - name: exercise__interval__start_time
            description: Start time of the exercise interval.
            data_type: timestamp
            data_tests:
              - not_null
          - name: exercise__interval__end_time
            description: End time of the exercise interval.
            data_type: timestamp
            data_tests:
              - not_null
          - name: exercise__metrics_summary__steps
            description: Steps recorded during the exercise session.
            data_type: varchar
          - name: exercise__metrics_summary__calories_kcal
            description: Calories burned during the exercise session (kcal).
            data_type: integer
          - name: exercise__metrics_summary__distance_millimeters
            description: Distance covered during the exercise session in millimetres.
            data_type: integer
          - name: _dlt_id
            description: dlt-generated row hash for the raw table.
            data_type: varchar
            data_tests:
              - not_null
