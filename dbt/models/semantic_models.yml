---
version: 2
semantic_models:
  - name: habits
    description: Semantic model for habit tracking data combining life habits, health
      habits (sleep), and community engagement habits.
    model: ref('fct_habit_occurrence')
    entities:
      - name: habit_record
        type: primary
        expr: habit_occurrence_key
    dimensions:
      - name: habit_date
        type: time
        type_params:
          time_granularity: day
        expr: cast(date_key as date)
      - name: habit_period
        type: categorical
        expr: habit_period
      - name: habit_key
        type: categorical
        expr: habit_key
    measures:
      - name: habit_completions
        description: Count of completed habits
        agg: sum
        expr: |
          case when is_complete then 1 else 0 end
      - name: total_habits
        description: Total count of habit records
        agg: count
        expr: habit_occurrence_key
      - name: completion_rate
        description: >
          Percentage of row-level habits completed. Count habits are excluded
          because their adherence is evaluated at the aggregation grain
          (is_complete is NULL by design).
        agg: average
        expr: |
          case
            when is_complete then 1.0
            when not is_complete then 0.0
          end
  - name: engagement_contacts
    description: 'Semantic model for HubSpot engagements joined with person and group
      information. Grain: engagement + contact.'
    model: ref('fct_engagement')
    entities:
      - name: engagement_contact
        type: primary
        expr: engagement_key
      - name: engagement
        type: foreign
        expr: engagement_id
      - name: contact
        type: foreign
        expr: person_key
      - name: company
        type: foreign
        expr: group_key
    dimensions:
      - name: engagement_date
        type: time
        type_params:
          time_granularity: day
        expr: cast(date_key as date)
      - name: engagement_type
        type: categorical
        expr: engagement_type
      - name: is_synchronous
        type: categorical
        expr: |
          case when is_synchronous then 'synchronous' else 'asynchronous' end
      - name: engagement_kind
        type: categorical
        expr: engagement_kind
    measures:
      - name: engagement_count
        description: Total count of distinct engagements
        agg: count_distinct
        expr: engagement_id
      - name: synchronous_engagements
        description: Count of distinct synchronous engagements (calls, meetings)
        agg: count_distinct
        expr: |
          case when is_synchronous then engagement_id else null end
      - name: asynchronous_engagements
        description: Count of distinct asynchronous engagements (emails, etc.)
        agg: count_distinct
        expr: |
          case when not is_synchronous then engagement_id else null end
      - name: contact_count
        description: Count of distinct contacts involved in engagements
        agg: count_distinct
        expr: person_key
