version: 2

seeds:
  - name: google_health__sleep
    config:
      column_types:
        name: varchar
        sleep__type: varchar
        sleep__create_time: timestamptz
        sleep__update_time: timestamptz
        sleep__summary__minutes_in_sleep_period: integer
        sleep__summary__minutes_after_wake_up: integer
        sleep__summary__minutes_to_fall_asleep: integer
        sleep__summary__minutes_asleep: integer
        sleep__summary__minutes_awake: integer
        sleep__summary__stages_summary: varchar
        sleep__metadata__processed: boolean
        sleep__metadata__main_sleep: boolean
        sleep__interval__start_time: timestamptz
        sleep__interval__start_utc_offset: varchar
        sleep__interval__end_time: timestamptz
        sleep__interval__end_utc_offset: varchar
        data_source__recording_method: varchar
        data_source__platform: varchar
        data_source__application__google_web_client_id: varchar
        _dlt_load_id: varchar
        _dlt_id: varchar
        sleep__metadata__stages_status: varchar
        sleep__metadata__external_id: varchar
        sleep__metadata__nap: boolean
        data_source__device__display_name: varchar
        sleep__metadata__manually_edited: boolean

  - name: google_health__steps
    config:
      column_types:
        steps__count: integer
        steps__interval__start_time: timestamptz
        steps__interval__start_utc_offset: varchar
        steps__interval__end_time: timestamptz
        steps__interval__end_utc_offset: varchar
        steps__interval__civil_end_time__time__minutes: integer
        steps__interval__civil_end_time__date__year: integer
        steps__interval__civil_end_time__date__month: integer
        steps__interval__civil_end_time__date__day: integer
        steps__interval__civil_start_time__date__year: integer
        steps__interval__civil_start_time__date__month: integer
        steps__interval__civil_start_time__date__day: integer
        data_source__recording_method: varchar
        data_source__platform: varchar
        data_source__application__web_client_id: varchar
        _dlt_load_id: varchar
        _dlt_id: varchar
        steps__interval__civil_start_time__time__minutes: integer
        steps__interval__civil_end_time__time__hours: integer
        steps__interval__civil_start_time__time__hours: integer
        data_source__device__display_name: varchar

  - name: google_health__exercise
    config:
      column_types:
        name: varchar
        exercise__exercise_type: varchar
        exercise__display_name: varchar
        exercise__active_duration: varchar
        exercise__update_time: timestamptz
        exercise__create_time: timestamptz
        exercise__metrics_summary__calories_kcal: integer
        exercise__metrics_summary__distance_millimeters: integer
        exercise__metrics_summary__steps: integer
        exercise__metrics_summary__average_pace_seconds_per_meter: float
        exercise__interval__start_time: timestamptz
        exercise__interval__start_utc_offset: varchar
        exercise__interval__end_time: timestamptz
        exercise__interval__end_utc_offset: varchar
        data_source__recording_method: varchar
        data_source__platform: varchar
        data_source__application__web_client_id: varchar
        _dlt_load_id: varchar
        _dlt_id: varchar
        exercise__metrics_summary__average_speed_millimeters_per_second: float
        exercise__exercise_metadata__has_gps: boolean
