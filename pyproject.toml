[project]
name = "personal-reporting-pipelines"
version = "1.0.0"
description = "Personal data integration and analytics platform tracking personal disciplines/habits"
requires-python = ">=3.12"
dependencies = [
    "dlt[bigquery,parquet,duckdb,databricks]",
    "google-cloud-bigquery-storage",
    "google-cloud-secret-manager",
    "google-api-python-client",
    "oauth2client<4",
    "psutil",
    "dbt~=2.0",
    "google-api-core>=2.15.0",
    "google-cloud-dataproc~=5.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-dotenv",
    "pytest-mock",
    "prek",
    "ruff",
    "types-PyYAML",
    "types-requests",
    "responses",
    "faker",
    "marimo",
    "sphinx",
    "sphinx-rtd-theme",
    "myst-parser",
    "sphinx-autoapi",
    "dbt-bouncer",
    "yamlfix>=1.19.1",
]

[tool.ruff]
line-length = 100
exclude = [
    ".git",
    "__pycache__",
    "dbt/dbt_packages",
    "docs",
]

[tool.pytest.ini_options]
markers = [
    "e2e: marks tests as end-to-end tests",
    "live: marks tests that call external APIs and require explicit opt-in",
    "local: marks executable offline",
]
# Disable responses plugin by default to prevent interference with e2e tests
addopts = "-s -p no:pytest-responses --log-cli-level=INFO"
log_cli = true
log_cli_level = "INFO"
# Test discovery patterns
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["pipelines"]
branch = true
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
    "*/virtualenvs/*",
]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol.*\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

[tool.mypy]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# dlt config dicts are not well-typed; suppress errors in pipeline source files
module = ["pipelines.hubspot", "pipelines.google_health", "pipelines.notion"]
ignore_errors = true

[[tool.mypy.overrides]]
# Sphinx-generated config file; not worth annotating
module = ["docs.source.conf"]
ignore_errors = true

[tool.bandit]
# B101 (assert) and B608 (SQL) are expected patterns in pytest test files
exclude_dirs = ["tests"]
skips = ["B105", "B106", "B608"]

[tool.yamlfix]
sequence_style = "block_style"
