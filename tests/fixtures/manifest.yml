version: 1

# The manifest describes the checked-in HTTP fixtures, not production API
# credentials.  Tests use it to validate response shape and cursor contracts.
resources:
  notion__data_source_rows:
    source: notion
    data_field: results
    identity_path: id
    cursor_path: next_cursor
    request_cursor_path: start_cursor
    request_cursor_location: json
    has_more_path: has_more
    incremental_cursor_path: last_edited_time
    files:
      run1_page1: notion/notion__data_source_rows-run1_page1.json
      run1_page2: notion/notion__data_source_rows-run1_page2.json
      run2: notion/notion__data_source_rows-run2.json

  google_health__sleep:
    source: google_health
    data_field: dataPoints
    identity_path: name
    cursor_path: nextPageToken
    request_cursor_path: pageToken
    request_cursor_location: query
    incremental_cursor_path: sleep.interval.endTime
    files:
      run1_page1: google_health/google_health__sleep-run1_page1.json
      run1_page2: google_health/google_health__sleep-run1_page2.json
      run2: google_health/google_health__sleep-run2.json

