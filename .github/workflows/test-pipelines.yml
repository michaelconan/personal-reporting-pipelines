name: test dlt pipelines

on:
  pull_request:
    branches:
      - main
    paths:
      - 'pipelines/**'
      - 'tests/**'
      - 'uv.lock'
      - 'pyproject.toml'
      - 'mise.toml'
      - 'scripts/databricks_warehouse.py'

permissions:
  contents: read

jobs:
  test-pipelines:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    env:
      MISE_ENABLE_TOOLS: uv,python,databricks-cli
    steps:
      - name: checkout code
        uses: actions/checkout@v5

      - name: set up mise and project tools
        uses: jdx/mise-action@v4

      - name: install project dependencies
        run: mise run setup

      - name: install 1Password CLI
        if: github.actor != 'dependabot[bot]'
        uses: 1password/install-cli-action@v4
        with:
          version: latest

      - name: run local tests
        id: run_local_tests
        env:
          RUNTIME__LOG_LEVEL: 'INFO'
        run: mise run test

      - name: run integration tests
        id: run_int_tests
        if: github.actor != 'dependabot[bot]'
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          OP_ENVIRONMENT_ID: ${{ vars.OP_ENVIRONMENT_ID }}
          RUNTIME__LOG_LEVEL: 'INFO'
        run: op run --environment "$OP_ENVIRONMENT_ID" -- mise run test-live

      - name: run e2e tests
        id: run_e2e_tests
        if: github.actor != 'dependabot[bot]'
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          OP_ENVIRONMENT_ID: ${{ vars.OP_ENVIRONMENT_ID }}
          RUNTIME__LOG_LEVEL: 'INFO'
        run: op run --environment "$OP_ENVIRONMENT_ID" -- mise run test-e2e

      - name: check if tests ran
        id: check_tests
        if: always()
        run: |
          if [ "${{ steps.run_local_tests.outcome }}" != "skipped" ] || [ "${{ steps.run_int_tests.outcome }}" != "skipped" ] || [ "${{ steps.run_e2e_tests.outcome }}" != "skipped" ]; then
            echo "tests_ran=true" >> $GITHUB_OUTPUT
          else
            echo "tests_ran=false" >> $GITHUB_OUTPUT
          fi

      - name: upload coverage reports to Codecov
        if: steps.check_tests.outputs.tests_ran == 'true'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: true

      - name: upload test results to Codecov
        if: steps.check_tests.outputs.tests_ran == 'true'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./test-results-local.xml,./test-results-e2e.xml
          report_type: test_results
