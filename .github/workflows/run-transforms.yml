name: run dbt transformations
on:
  schedule:
    - cron: '0 6 * * 1' # monday at 6 AM UTC
  workflow_dispatch:
    inputs:
      force_full_refresh:
        description: 'Force full refresh'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: read

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    env:
      DBT_TARGET: prod
      MISE_ENABLE_TOOLS: uv,python,databricks-cli
      # Skip the semantic-manifest validation notice (no dbt_cloud.yml in this project)
      DBT_ENGINE_NO_WARN_SEMANTIC_MANIFEST_VALIDATION: '1'
    steps:
      - name: checkout code
        uses: actions/checkout@v5

      - name: set up mise and project tools
        uses: jdx/mise-action@v4

      - name: install project dependencies
        run: mise run setup

      - name: install 1Password CLI
        uses: 1password/install-cli-action@v4
        with:
          version: latest

      - name: install dbt dependencies
        run: mise run dbt-deps

      - name: run dbt build
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          OP_ENVIRONMENT_ID: ${{ vars.OP_ENVIRONMENT_ID }}
        run: |
          if [ "${{ inputs.force_full_refresh }}" = "true" ]; then
            op run --environment "$OP_ENVIRONMENT_ID" -- mise run dbt-build-prod -- --full-refresh
          else
            op run --environment "$OP_ENVIRONMENT_ID" -- mise run dbt-build-prod
          fi
