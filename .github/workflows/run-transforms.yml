name: run dbt transformations
on:
  schedule:
    - cron: '0 6 * * 1'  # monday at 6 AM UTC
  workflow_dispatch:
    inputs:
      force_full_refresh:
        description: 'Force full refresh'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: read

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    env:
      # Skip the semantic-manifest validation notice (no dbt_cloud.yml in this project)
      DBT_ENGINE_NO_WARN_SEMANTIC_MANIFEST_VALIDATION: '1'
    steps:
      - name: checkout code
        uses: actions/checkout@v5

      - name: set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: 'latest'
          enable-cache: true

      - name: set up python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: install uv and dependencies
        run: |
          make install

      - name: install 1password cli
        uses: 1password/install-cli-action@v3

      - name: inject Databricks credentials
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |
          op inject -f -i .env.databricks.tpl -o .env.databricks
          set -a && source .env.databricks && set +a

      - name: install dbt dependencies
        run: |
          uv run dbt deps --project-dir dbt --profiles-dir dbt

      - name: run dbt build
        run: |
          uv run dbt build --project-dir dbt --profiles-dir dbt --target prod ${{ inputs.force_full_refresh && '--full-refresh' || '' }}