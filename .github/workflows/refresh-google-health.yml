name: run google health pipeline
on:
  schedule:
    - cron: '0 5 * * 1' # monday at 5 AM UTC
  workflow_dispatch:
    inputs:
      force_full_refresh:
        description: 'Force full refresh'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: read

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    env:
      MISE_ENABLE_TOOLS: uv,python,databricks-cli
    steps:
      - name: checkout code
        uses: actions/checkout@v5

      - name: set up mise and project tools
        uses: jdx/mise-action@v4

      - name: install project dependencies
        run: mise run setup

      - name: install 1Password CLI
        uses: 1password/install-cli-action@v4
        with:
          version: latest

      - name: run google health pipeline
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          OP_ENVIRONMENT_ID: ${{ vars.OP_ENVIRONMENT_ID }}
          FORCE_FULL_REFRESH: ${{ inputs.force_full_refresh }}
          RUNTIME__LOG_LEVEL: 'INFO'
          PYTHONUNBUFFERED: '1'
        run: |
          op run --environment "$OP_ENVIRONMENT_ID" -- sh -c 'test "$DBT_TARGET" = "prod" || { echo "DBT_TARGET must be prod (got ${DBT_TARGET:-unset})"; exit 1; }'
          if [ "${{ inputs.force_full_refresh }}" = "true" ]; then
            op run --environment "$OP_ENVIRONMENT_ID" -- mise run pipeline -- google_health --full
          else
            op run --environment "$OP_ENVIRONMENT_ID" -- mise run pipeline -- google_health
          fi

      - name: upload dlt state files
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: google-health-pipeline-state
          path: |
            ~/.dlt/**/state.json
          retention-days: 7
