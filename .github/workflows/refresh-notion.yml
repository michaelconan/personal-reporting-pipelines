name: run notion pipeline
on:
  schedule:
    - cron: '0 4 * * 1'  # monday at 4 AM UTC
  workflow_dispatch:
    inputs:
      force_full_refresh:
        description: 'Force full refresh'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: read

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    env:
      MISE_ENABLE_TOOLS: uv,python,github:databricks/cli
    steps:
      - name: checkout code
        uses: actions/checkout@v5

      - name: set up mise and project tools
        uses: jdx/mise-action@v4

      - name: install project dependencies
        run: mise run setup

      - name: install 1Password CLI beta
        uses: 1password/install-cli-action@v4
        with:
          version: latest-beta

      - name: run notion pipeline
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          OP_ENVIRONMENT_ID: ${{ vars.OP_ENVIRONMENT_ID }}
          FORCE_FULL_REFRESH: ${{ inputs.force_full_refresh }}
          RUNTIME__LOG_LEVEL: "INFO"
          PYTHONUNBUFFERED: "1"
        run: |
          if [ "${{ inputs.force_full_refresh }}" = "true" ]; then
            mise run pipeline -- notion --full
          else
            mise run pipeline -- notion
          fi

      - name: upload dlt state files
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: notion-pipeline-state
          path: |
            ~/.dlt/**/state.json
          retention-days: 7
