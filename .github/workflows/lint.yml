name: Lint and Code Quality

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      MISE_ENABLE_TOOLS: uv,python
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up mise and project tools
        uses: jdx/mise-action@v4

      - name: Install dependencies
        run: mise run setup

      - name: Run prek checks
        run: mise run lint

      - name: Install dbt dependencies
        run: mise run dbt-deps

      - name: Run SQL linting
        run: mise run dbt-lint

      - name: Generate dbt artifacts
        run: |
          mise run dbt-parse-mock
          mise run dbt-compile-mock

      - name: Run dbt-bouncer checks
        uses: godatadriven/dbt-bouncer@v3.8
        with:
          config-file: dbt/dbt-bouncer.yml
