name: test dbt transformations
on:
  pull_request:
    branches:
      - main
    paths:
      - 'dbt/**/*.sql'
      - 'dbt/**/*.yml'
      - 'dbt/**/*.csv'
  push:
    branches:
      - main
    paths:
      - 'dbt/**'
      - 'dbt/**/*.yml'
      - 'dbt/**/*.csv'

permissions:
  contents: 'read'

jobs:
  test_dbt:
    runs-on: ubuntu-latest
    env:
      DBT_PROJECT_DIR: dbt
      DBT_PROFILES_DIR: dbt
      DBT_WARN_ERROR_OPTIONS: '{"silence":["NodeNotFoundOrDisabled"]}'
    steps:
      - name: check out code
        uses: actions/checkout@v5

      - name: set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: 'latest'
          enable-cache: true

      - name: set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install pipenv and dependencies
        run: |
          make install
          make dbt-deps

      - name: run local tests and docs
        run: |
          make dbt-build target=mock
          make dbt-docs target=mock
