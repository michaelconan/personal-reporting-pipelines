name: test dbt transformations
on:
  pull_request:
    branches:
      - main
    paths:
      - 'dbt/**/*.sql'
      - 'dbt/**/*.yml'
      - 'dbt/**/*.csv'
      - 'mise.toml'
      - 'scripts/databricks_warehouse.py'
      - 'scripts/validate_target.py'
      - 'pipelines/targets.py'

permissions:
  contents: 'read'

jobs:
  test_dbt:
    runs-on: ubuntu-latest
    env:
      DBT_PROJECT_DIR: dbt
      DBT_PROFILES_DIR: dbt
      MISE_ENABLE_TOOLS: uv,python,databricks-cli
      # Skip the semantic-manifest validation notice (no dbt_cloud.yml in this project)
      DBT_ENGINE_NO_WARN_SEMANTIC_MANIFEST_VALIDATION: '1'
    steps:
      - name: check out code
        uses: actions/checkout@v5

      - name: set up mise and project tools
        uses: jdx/mise-action@v4

      - name: install dependencies
        run: mise run setup

      - name: install dbt dependencies
        run: mise run dbt-deps

      - name: run local build (mock target with CSV fixtures)
        run: mise run dbt-build-mock

      - name: install 1Password CLI
        if: github.actor != 'dependabot[bot]'
        uses: 1password/install-cli-action@v4
        with:
          version: latest

      - name: run Databricks test build
        if: github.actor != 'dependabot[bot]'
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          OP_ENVIRONMENT_ID: ${{ vars.OP_ENVIRONMENT_ID }}
          DBT_TARGET: test
          DBT_SCHEMA: reporting_test
          RAW_SCHEMA: raw_test
        run: op run --environment "$OP_ENVIRONMENT_ID" -- env DBT_TARGET="$DBT_TARGET" DBT_SCHEMA="$DBT_SCHEMA" RAW_SCHEMA="$RAW_SCHEMA" mise run dbt-build
